<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>التقييم</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <main class="container">
    <a href="index.html" class="back">→ الرئيسية</a>

    <ol class="phase-track" aria-label="أقسام التقييم">
      <li id="track-skill">قياس المهارة</li>
      <li id="track-knowledge">قياس المعرفة</li>
      <li id="track-report">التقرير</li>
    </ol>

    <section class="card center hidden" id="view-loading" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text"></p>
      <p class="hint">يُجهَّز كل سؤال بناءً على إجاباتك، وقد يستغرق ذلك حتى دقيقة.</p>
    </section>

    <section class="card hidden" id="view-error" role="alert">
      <h2>حدث خطأ</h2>
      <p id="error-text"></p>
      <div class="actions">
        <button class="btn" id="retry-btn" type="button">حاول مرة أخرى</button>
      </div>
    </section>

    <section class="card hidden" id="view-intro">
      <h1 id="intro-title"></h1>
      <ul class="plain-list">
        <li id="intro-count"></li>
        <li>لا يمكن الرجوع إلى سؤال بعد الإجابة عنه.</li>
      </ul>
      <button class="btn" id="intro-start" type="button">ابدأ</button>
    </section>

    <section class="card hidden" id="view-question">
      <div class="q-head">
        <span id="q-section"></span>
        <span class="muted" id="q-counter"></span>
      </div>
      <div class="progress" aria-hidden="true"><div class="progress-bar" id="q-progress"></div></div>

      <p class="q-text" id="q-text"></p>
      <pre class="code hidden" dir="ltr"><code id="q-code"></code></pre>

      <fieldset class="options" id="q-options">
        <legend class="sr-only">اختر إجابة</legend>
      </fieldset>
      <div class="hidden" id="q-order-box">
        <p class="hint">رتّب العناصر من الأول إلى الأخير باستخدام الأسهم.</p>
        <ol class="order-list" id="q-order"></ol>
      </div>
      <div class="hidden" id="q-open">
        <label for="q-answer" class="sr-only">إجابتك</label>
        <textarea id="q-answer" rows="7" maxlength="3000" placeholder="اكتب إجابتك هنا…"></textarea>
        <p class="hint"><span id="q-answer-count">0</span> / 3000</p>
      </div>

      <p class="error" id="q-error"></p>
      <div class="q-nav">
        <button class="btn" id="q-submit" type="button" disabled>التالي</button>
      </div>
    </section>
  </main>

  <script src="js/assessment.js?v=3"></script>
</body>
</html>
